name: CI

on:
  push:
    branches: ["main", "feat/*", "fix/*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    name: verify (${{ matrix.os }} / node ${{ matrix.node }} / pi pi-tui)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.19.0", "22.x"]
        # Pi host is pinned to 0.84.2 per spec; devDeps uses ^0.84.2 range for expected compatibility
        # The TUI E2E seam runs against the installed pi-coding-agent at that version.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: acceptance matrix fixture checks (synthetic / pinned @98e78ca / adversarial)
        run: npm run test:acceptance

  provenance-smoke:
    name: provenance smoke (no publish)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm pack --dry-run 2>&1 | tail -20
      - run: echo "Tag ${{ github.ref_name }} would publish to npm with --provenance after full matrix green (see publish.yml)"
