name: Publish

# v* tag → CI full matrix green → npm publish --provenance (OIDC) to latest/next.
# 0.y pre-releases publish to `next`; stable tags publish to `latest`.
# provenance is required per Issue #24; Git tags mirror npm versions.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # for GitHub Release
  id-token: write   # for npm provenance (OIDC)

jobs:
  gate:
    name: gate — full matrix must be green
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish ${{ github.ref_name }} → npm (provenance)
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"
          # npm provenance via OIDC trusted publisher (no NPM_TOKEN needed)
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: derive npm tag (latest vs next) and validate SemVer
        id: tag
        run: |
          REF="${GITHUB_REF_NAME#v}"
          echo "version=$REF" >> "$GITHUB_OUTPUT"
          # Validate SemVer (strict)
          V="$REF" node -e "const v=process.env.V; if(!/^\\d+\\.\\d+\\.\\d+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?\$/.test(v)) { console.error('Invalid SemVer:', v); process.exit(1) }"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$REF" ]; then
            echo "::error::Tag version $REF does not match package.json version $PKG — aborting (Git tags mirror npm versions)"
            exit 1
          fi
          if [[ "$REF" == *"-"* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Ref $REF → npm dist-tag $([ "$REF" = *"-"* ] && echo next || echo latest)"

      - name: debug OIDC token (temporary)
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL exists: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          echo "GITHUB_REF=$GITHUB_REF GITHUB_REF_NAME=$GITHUB_REF_NAME"
          # Try to fetch an OIDC token for npm audience and show its claims (no secret)
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | python3 -c "import sys,json; d=json.load(sys.stdin); print({k: d.get(k) for k in ['aud','iss','repository','repository_owner','workflow','ref','workflow_ref']})" 2>&1 | head -n 20 || echo "OIDC fetch failed or not JSON"
          fi

      - name: npm publish --provenance (OIDC)
        run: |
          # Requires a trusted publisher configured in npm (OIDC). For manual runs without it, this step will fail closed.
          npm publish --provenance --tag "${{ steps.tag.outputs.npm_tag }}" --access public --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: create GitHub Release (mirror)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          # tag v* already exists; release mirrors npm package version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: verify provenance
        run: |
          echo "Verify: https://www.npmjs.com/package/pi-codex-marketplace/v/${{ steps.tag.outputs.version }}"
          sleep 10
          npm view pi-codex-marketplace dist.tags --json 2>&1 | tail -20 || true
