name: CI

on:
  push:
    branches: ["main", "feat/*", "fix/*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    name: verify (${{ matrix.os }} / node ${{ matrix.node }} / pi pi-tui)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.19.0", "22.x", "24.x"]
        # The verify matrix runs the lockfile's validated Pi host (devDependencies).
        # The TUI E2E seam runs against the installed pi-coding-agent at that version.
        # The 0.84.2 compatibility floor is covered by the compat job below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: acceptance matrix fixture checks (synthetic / pinned @98e78ca / adversarial)
        run: npm run test:acceptance

  compat:
    name: compat (Pi 0.84.2 floor / node 22.19.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - name: downgrade to the Pi 0.84.2 compatibility floor (lockfile untouched)
        run: npm install --no-save @earendil-works/pi-coding-agent@0.84.2 @earendil-works/pi-tui@0.84.2 @earendil-works/pi-ai@0.84.2
      - name: assert the compatibility floor is the host under test
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const expected = '0.84.2';
          for (const name of ['pi-coding-agent', 'pi-tui', 'pi-ai']) {
            const { version } = JSON.parse(readFileSync(`node_modules/@earendil-works/${name}/package.json`, 'utf8'));
            if (version !== expected) {
              console.error(`@earendil-works/${name} resolved ${version}, expected ${expected}`);
              process.exit(1);
            }
            console.log(`@earendil-works/${name} ${version}`);
          }
          NODE
      - run: npm run typecheck
      - run: npm test

  provenance-smoke:
    name: provenance smoke (no publish)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm pack --dry-run 2>&1 | tail -20
      - run: echo "Tag ${{ github.ref_name }} would publish to npm with --provenance after full matrix green (see publish.yml)"
